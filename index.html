        <body>
            <canvas id="glcanvas" tabindex='1'></canvas>
            <script>
                const canvas = document.getElementById("glcanvas");

                function resizeCanvasToViewport() {
                    const dpr = Math.max(1, window.devicePixelRatio || 1);
                    const width = Math.floor(window.innerWidth);
                    const height = Math.floor(window.innerHeight);

                    canvas.style.width = `${width}px`;
                    canvas.style.height = `${height}px`;

                    // Keep WebGL backing buffer in sync with CSS pixels on high DPI screens.
                    canvas.width = Math.floor(width * dpr);
                    canvas.height = Math.floor(height * dpr);
                }

                window.addEventListener("resize", resizeCanvasToViewport, { passive: true });
                window.addEventListener("orientationchange", resizeCanvasToViewport, { passive: true });
                resizeCanvasToViewport();
            </script>
